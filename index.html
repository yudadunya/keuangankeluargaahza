<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatUang - Cukup chat, langsung tercatat.</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col h-screen max-w-md mx-auto relative shadow-2xl border-x border-slate-200">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-100 py-3 px-4 flex items-center justify-between z-10">
        <div class="flex items-center space-x-3">
            <!-- Logo ChatUang Baru -->
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid fa-comment-dollar text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-900 leading-none">ChatUang</h1>
                <p class="text-xs text-slate-500 mt-1">Cukup chat, langsung tercatat.</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleAccountsModal()" class="bg-teal-50 text-teal-700 p-2 rounded-full hover:bg-teal-100 transition">
                <i class="fa-solid fa-wallet text-sm"></i>
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER (TABS) -->
    <main class="flex-1 overflow-hidden relative pb-16">
        <!-- TAB 1: CHAT AI -->
        <div id="tab-chat" class="absolute inset-0 flex flex-col bg-slate-50">
            <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Sambutan AI -->
                <div class="flex items-start space-x-2">
                    <div class="w-8 h-8 rounded-full bg-teal-600 text-white flex items-center justify-center shrink-0 shadow">
                        <i class="fa-solid fa-robot text-xs"></i>
                    </div>
                    <div class="bg-white p-3.5 rounded-2xl rounded-tl-none shadow-sm border border-slate-100 text-sm max-w-[80%]">
                        <p class="font-semibold text-teal-800 mb-1">Halo!</p>
                        <p>Saya asisten keuangan <strong>ChatUang</strong> Anda. Ketik transaksi secara natural, contoh:</p>
                        <p class="text-xs bg-slate-100 p-2 rounded mt-2 text-slate-600 font-mono">"makan siang bca 35rb"<br>"transfer dari bca ke bsi 500rb"</p>
                    </div>
                </div>
            </div>

            <!-- Input Chat -->
            <div class="p-3 bg-white border-t border-slate-100">
                <form id="chat-form" onsubmit="handleChatSubmit(event)" class="flex items-center space-x-2">
                    <input type="text" id="chat-input" placeholder="Ketik transaksi Anda..." autocomplete="off"
                        class="flex-1 bg-slate-100 border-none rounded-full px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <button type="submit" class="bg-teal-600 text-white w-11 h-11 rounded-full flex items-center justify-center hover:bg-teal-700 transition shadow">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- TAB 2: LAPORAN / JURNAL -->
        <div id="tab-reports" class="absolute inset-0 hidden flex flex-col bg-slate-50 overflow-y-auto p-4 space-y-4">
            <div class="bg-gradient-to-r from-teal-600 to-emerald-500 text-white p-4 rounded-2xl shadow-lg">
                <p class="text-xs opacity-80 uppercase tracking-wider font-semibold">Total Kekayaan Bersih</p>
                <h2 id="total-balance-text" class="text-2xl font-bold mt-1">Rp 0</h2>
            </div>
            
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Riwayat Transaksi</h3>
                <button onclick="loadTransactions()" class="text-teal-600 text-xs font-semibold hover:underline">
                    <i class="fa-solid fa-rotate-right mr-1"></i> Muat Ulang
                </button>
            </div>

            <div id="transactions-list" class="space-y-2 pb-6">
                <!-- Data transaksi akan dimuat secara dinamis di sini -->
                <p class="text-center text-xs text-slate-400 py-6">Memuat data transaksi...</p>
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 flex justify-around py-2 z-20">
        <button onclick="switchTab('chat')" id="nav-chat" class="flex flex-col items-center text-teal-600 transition">
            <i class="fa-solid fa-comments text-lg"></i>
            <span class="text-[10px] font-medium mt-1">Chat AI</span>
        </button>
        <button onclick="switchTab('reports')" id="nav-reports" class="flex flex-col items-center text-slate-400 hover:text-slate-600 transition">
            <i class="fa-solid fa-wallet text-lg"></i>
            <span class="text-[10px] font-medium mt-1">Dompet & Jurnal</span>
        </button>
    </nav>

    <!-- MODAL AKUN / DOMPET -->
    <div id="accounts-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-900">Daftar Rekening & Dompet</h3>
                <button onclick="toggleAccountsModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="accounts-list" class="space-y-3">
                <!-- Daftar akun dimuat dinamis -->
            </div>
        </div>
    </div>

    <!-- SCRIPT UTAMA -->
    <script>
        // KONFIGURASI SUPABASE (Ganti dengan kredensial Anda)
        const SUPABASE_URL = 'https://YOUR_SUPABASE_URL.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentActiveTab = 'chat';

        function switchTab(tab) {
            currentActiveTab = tab;
            const chatTab = document.getElementById('tab-chat');
            const reportsTab = document.getElementById('tab-reports');
            const navChat = document.getElementById('nav-chat');
            const navReports = document.getElementById('nav-reports');

            if (tab === 'chat') {
                chatTab.classList.remove('hidden');
                reportsTab.classList.add('hidden');
                navChat.className = "flex flex-col items-center text-teal-600 transition";
                navReports.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 transition";
            } else {
                chatTab.classList.add('hidden');
                reportsTab.classList.remove('hidden');
                navReports.className = "flex flex-col items-center text-teal-600 transition";
                navChat.className = "flex flex-col items-center text-slate-400 hover:text-slate-600 transition";
                loadDashboardData();
            }
        }

        function toggleAccountsModal() {
            const modal = document.getElementById('accounts-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                loadAccountsData();
            }
        }

        async function handleChatSubmit(e) {
            e.preventDefault();
            const inputEl = document.getElementById('chat-input');
            const text = inputEl.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputEl.value = '';

            // Simulasi pemrosesan AI ChatUang
            setTimeout(() => {
                appendMessage(`Baik, transaksi "${text}" berhasil diproses dan dicatat ke sistem ChatUang.`, 'ai');
            }, 500);
        }

        function appendMessage(text, sender) {
            const container = document.getElementById('chat-container');
            const isUser = sender === 'user';
            
            const bubbleHTML = `
                <div class="flex items-start space-x-2 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}">
                    <div class="w-8 h-8 rounded-full ${isUser ? 'bg-slate-800' : 'bg-teal-600'} text-white flex items-center justify-center shrink-0 shadow text-xs">
                        <i class="fa-solid ${isUser ? 'fa-user' : 'fa-robot'}"></i>
                    </div>
                    <div class="${isUser ? 'bg-teal-600 text-white rounded-tr-none' : 'bg-white text-slate-800 border border-slate-100 rounded-tl-none'} p-3.5 rounded-2xl shadow-sm text-sm max-w-[80%]">
                        <p>${text}</p>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', bubbleHTML);
            container.scrollTop = container.scrollHeight;
        }

        async function loadTransactions() {
            const listEl = document.getElementById('transactions-list');
            listEl.innerHTML = '<p class="text-center text-xs text-slate-400 py-4">Memuat data...</p>';
            
            // Contoh data statis/placeholder jika tabel belum diisi
            setTimeout(() => {
                listEl.innerHTML = `
                    <div class="bg-white p-3 rounded-xl border border-slate-100 shadow-sm flex justify-between items-center">
                        <div>
                            <p class="font-semibold text-sm text-slate-800">Makan Siang</p>
                            <p class="text-xs text-slate-400">BCA • Hari ini</p>
                        </div>
                        <span class="text-rose-600 font-bold text-sm">-Rp 35.000</span>
                    </div>
                `;
            }, 300);
        }

        async function loadAccountsData() {
            const accList = document.getElementById('accounts-list');
            accList.innerHTML = `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                    <span class="font-medium text-sm">BCA</span>
                    <span class="font-bold text-sm text-teal-700">Rp 1.500.000</span>
                </div>
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                    <span class="font-medium text-sm">BSI</span>
                    <span class="font-bold text-sm text-teal-700">Rp 500.000</span>
                </div>
            `;
        }

        async function loadDashboardData() {
            document.getElementById('total-balance-text').innerText = 'Rp 2.000.000';
            loadTransactions();
        }
    </script>
</body>
</html>
